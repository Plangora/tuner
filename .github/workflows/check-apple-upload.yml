name: Check Apple upload access

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Optional build number to inspect
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check app visibility and build status
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          ASC_BUILD_NUMBER: ${{ inputs.build_number }}
        run: node .github/scripts/check-apple-access.mjs
