# GitHub Actions Workflow: Build Flutter Web App
#
# Builds and deploys the Tuner app as a web application
# Can be hosted on GitHub Pages or any web server
#
# SETUP: No additional secrets required
#
# TRIGGERS:
# - Manual dispatch from Actions tab
# - Push to main branch (optional - uncomment to auto-deploy)
# - Tag push (v*.*.*)

name: Build Web App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Uncomment to auto-deploy on every push to main
  # push:
  #   branches:
  #     - main

jobs:
  build:
    name: Build Web Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'

      - name: Get dependencies
        run: |
          flutter pub get
          flutter analyze

      # Build the web app for production
      # This creates an optimized, minified JavaScript bundle
      - name: Build web app
        run: |
          flutter build web \
            --release \
            --web-renderer=html \
            --verbose

      # Optional: Build with CanvasKit renderer for better graphics
      # Uncomment to use CanvasKit (larger download, better visuals)
      # This is useful if the app heavily uses custom painting
      # - name: Build web app (CanvasKit)
      #   run: |
      #     flutter build web \
      #       --release \
      #       --web-renderer=canvaskit \
      #       --verbose

      # Upload the web app to GitHub Pages
      # This makes the app accessible at: https://plangora.github.io/tuner/
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          cname: tuner.plangora.dev  # Optional: use custom domain

      # Upload as artifact for manual deployment
      - name: Upload web artifact
        uses: actions/upload-artifact@v3
        with:
          name: web-build
          path: build/web/
          retention-days: 30

      - name: Build complete
        run: |
          echo "✅ Web build successful!"
          echo "📦 Web app ready in artifacts"
          echo "🌐 Access at: https://plangora.github.io/tuner/"
